name: Build Windows

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Allow postinstall (download-model.mjs) to fetch the
          # MediaPipe model from Google CDN.
          ELECTRON_BUILDER_CACHE: .cache/electron-builder

      - name: Build Windows installer
        run: npm run build:win
        env:
          # Academic prototype — no Authenticode certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # GitHub Actions provides this automatically; set so
          # electron-builder can write to GH releases when invoked
          # via release event below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: posturepal-desktop-windows
          path: dist/*-setup.exe
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*-setup.exe \
            --clobber
